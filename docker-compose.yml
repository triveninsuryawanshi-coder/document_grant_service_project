version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grants_svc_db
    environment:
      POSTGRES_USER: grants_user
      POSTGRES_PASSWORD: grants_password
      POSTGRES_DB: grants_svc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grants_user -d grants_svc"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
